name: CI

on:
  push:
    branches: ["**"]
  pull_request:

# A new push supersedes the run in flight for the same branch.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  backend:
    name: backend (pytest)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      # The same image the app ships in, so the suite runs against the pinned
      # wheels and the CJK font the 出典 stamp needs — exactly what
      # `docker compose run --rm test` does locally.
      - name: Build the test image
        run: docker compose build test

      # The service is network_mode: none, so a test that reached for a DEM
      # tile fails here rather than making CI slow and flaky.
      - name: Run the suite
        run: docker compose run --rm test

  frontend:
    name: frontend (vitest + build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: "24"        # matches the Dockerfile's build stage
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - run: npm ci

      - name: Run the suite
        run: npm test

      # `npm run build` is `tsc -b && vite build`, so this type-checks the app
      # and the tests as well as proving the bundle still builds.
      - name: Type-check and build
        run: npm run build
