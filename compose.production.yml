# docker compose -f docker-compose.yml -f compose.production.yml up -d --build
# Requires Compose 2.24.4+ for !reset. The API has no public host port.
services:
  app:
    ports: !reset []
  proxy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    environment:
      - PUBLIC_DOMAIN=${PUBLIC_DOMAIN:?Set PUBLIC_DOMAIN to your public hostname}
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      app:
        condition: service_healthy
    mem_limit: 256m
    cpus: 0.5
    pids_limit: 128
    security_opt: [no-new-privileges:true]
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  caddy_data:
  caddy_config:
